
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030712">
    <title>Website</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <canvas id="snow-canvas" aria-hidden="true"></canvas>

    <header class="navbar">
        <a href="#" class="logo">
            <span class="gradient-text">Metastasis</span>
            <span class="logo-dot">.</span>
        </a>

        <nav class="nav-links" id="nav-links">
            <a href="#home" class="active">Home</a>
            <a href="#about">About</a>
        </nav>

        <a href="#experience" class="nav-button">Project ↗</a>

        <button class="menu-toggle"
                id="menu-toggle"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="nav-links">
            ☰
        </button>
    </header>

    <main>
        <section class="opener" id="home">

            <div class="opener-content">
                <div class="status">
                    <span class="working-dot"></span>
                    Work in Progress
                </div>

                <h1>
                    Locus Pecathon<br>
                    <span class="gradient-text">Team Metastasis</span>
                </h1>

                <p class="opener-description">
                    Project
                </p>

                <div class="opener-buttons">
                    <a href="#experience" class="primary-button">
                        Project <span>↗</span>
                    </a>

                    <a href="#about" class="secondary-button">
                        Discover More <span>↓</span>
                    </a>
                </div>
            </div>

            <div class="opener-visual" aria-hidden="true">
                <div class="orb orb-outer"></div>
                <div class="orb orb-middle"></div>
                <div class="orb orb-inner"></div>
                <div class="orb-core"></div>
                <div class="orb-label"></div>
            </div>

            <div class="scroll-indicator">
                <span class="scroll-line"></span>
                
            </div>

        </section>

        <section class="info-section" id="about">
            <span class="section-label"></span>
            <h2><span></span></h2>
            <p>

            </p>
        </section>

        <section class="info-section" id="experience">
            <span class="section-label"></span>
            <h2><span></span></h2>
            <p>

            </p>
        </section>

        <footer id="contact">
            <a href="#home" class="logo">Metastasis<span class="logo-dot">.</span></a>
            <p>.</p>
        </footer>
    </main>

</body>
</html>
